edition = "2023";

package proto.metal.v1;

import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package = "github.com/endobit/gen/go/proto/metal/v1;metalv1";




//
// Read
//

message ReadReportDataRequest {
  string zone = 1;
  string cluster = 2;
  oneof make {
    string host = 3;
	string switch = 4;
  }
}

message ReadReportDataResponse {
  bytes data = 1;
}
